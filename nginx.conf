server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    # The HTML shell references content-hashed asset filenames, so it must
    # never be cached — otherwise browsers can keep serving an old index.html
    # (pointing at old, since-replaced bundle filenames) indefinitely after a
    # deploy, with no way to pick up the new build short of a hard refresh.
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
